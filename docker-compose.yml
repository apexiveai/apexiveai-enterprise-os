
name: max-enterprise-os

services:
  postgres:
    image: postgres:17
    container_name: max-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: max_enterprise
      POSTGRES_USER: max
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Yangon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U max -d max_enterprise
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - max-network

  redis:
    image: redis:7-alpine
    container_name: max-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - max-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TENANT_ID: ${VITE_TENANT_ID:-local-workspace}
    restart: "no"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://max:${POSTGRES_PASSWORD}@postgres:5432/max_enterprise
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - max-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TENANT_ID: ${VITE_TENANT_ID:-local-workspace}
    container_name: apexiveai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_NAME: ApexiveAI Enterprise OS
      ENVIRONMENT: ${APP_ENV:-development}
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://max:${POSTGRES_PASSWORD}@postgres:5432/max_enterprise
      REDIS_URL: redis://redis:6379/0
      PORT: "8765"
      OBJECT_STORAGE_PATH: /app/data/objects
      APEXIVE_FRONTEND_DIR: /app/frontend/dist
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - object_data:/app/data/objects
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - max-network

volumes:
  postgres_data:
    name: max-postgres-data
  redis_data:
    name: max-redis-data
  object_data:
    name: apexiveai-object-data

networks:
  max-network:
    name: max-enterprise-network
    driver: bridge
